<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دەنگ</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="icons/icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--side:#d4d4d4;--main:#fff;--bar:#d4d4d4;--ink:#111;--mute:#6b6b6b;--line:#e4e4e4;--chip:#d9d9d9;--hover:#f2f2f2;--focus:#111;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0d;--side:#1c1c1c;--main:#141414;--bar:#1c1c1c;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2a2a2a;--chip:#2a2a2a;--hover:#1f1f1f;--focus:#fff}}
:root[data-theme=dark]{--bg:#0d0d0d;--side:#1c1c1c;--main:#141414;--bar:#1c1c1c;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2a2a2a;--chip:#2a2a2a;--hover:#1f1f1f;--focus:#fff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;height:100%;background:var(--main);display:grid;grid-template-columns:230px 1fr;grid-template-rows:1fr 84px;overflow:hidden}
aside{grid-row:1;background:var(--side);padding:22px 18px;overflow:auto}
.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;margin-bottom:26px}
.logo img{width:36px;height:36px;display:block}
nav button{width:100%;justify-content:flex-start;gap:10px;padding:7px 12px;border:2px solid transparent;border-radius:8px;font-size:14px;margin-bottom:6px;color:var(--mute);transition:background .2s,border-color .2s,color .2s}
nav button:hover{background:var(--hover)}
nav button[aria-current=page]{border-color:var(--ink);color:var(--ink);font-weight:500}
nav h3{font-size:13px;font-weight:500;margin:22px 12px 10px}
main{grid-row:1;overflow:auto;padding:22px 30px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.search{flex:1;max-width:340px;background:var(--chip);border-radius:20px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;font:inherit;font-size:13px;padding:9px 0;color:var(--ink);outline:0}
.search:focus-within{outline:2px solid var(--focus)}
.top .sp{flex:1}
.ib{width:34px;height:34px;border-radius:50%;font-size:17px}
.ib:hover{background:var(--hover)}
.add{background:var(--ink);color:var(--main);border-radius:18px;padding:8px 16px;font-size:13px;gap:6px}
#view{transition:opacity .22s,transform .22s}
#view.out{opacity:0;transform:translateY(8px)}
.hero{display:flex;gap:22px;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap}
.cover{width:150px;height:150px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;background-size:cover}
.hero h1{font-size:24px;margin:0 0 4px}
.hero p{margin:0;font-weight:700;font-size:14px;color:var(--mute)}
.strip{display:flex;gap:10px;margin-inline-start:auto}
.strip .cover{width:62px;height:62px;font-size:22px;border-radius:3px;opacity:.9}
.strip .cover:hover{opacity:1}
h2{font-size:17px;margin:0 0 10px}
.row{display:grid;grid-template-columns:1fr 140px 60px 34px;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:14px;width:100%;text-align:start;transition:background .15s}
.row:hover{background:var(--hover)}
.row b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on b{text-decoration:underline;text-underline-offset:4px}
.row .pl{font-size:20px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.g{text-align:start;display:block;border-radius:8px;transition:transform .2s}
.g:hover{transform:translateY(-3px)}
.g .cover{width:100%;height:auto;aspect-ratio:1;font-size:40px;border-radius:6px}
.g b{display:block;margin-top:8px;font-size:14px}.g small{color:var(--mute)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--mute);line-height:2}
.empty b{color:var(--ink);display:block;font-size:16px}
footer{grid-column:1/-1;background:var(--bar);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:16px;padding:0 24px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .cover{width:52px;height:52px;font-size:20px;border-radius:3px}
.np .ib{flex:none}.np .ib:first-of-type{margin-inline-start:auto}.np b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np small{color:var(--mute)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;gap:14px;align-items:center;font-size:18px}
.btns .big{font-size:26px}
.btns .on{color:var(--ink);background:var(--chip);border-radius:50%}
.btns button{width:30px;height:30px;border-radius:50%}
.bar{display:flex;align-items:center;gap:8px;width:100%;font-size:11px;color:var(--mute);direction:ltr}
.vol{display:flex;align-items:center;gap:10px;justify-content:flex-end;font-size:17px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),#8886 var(--p,0%));flex:1;min-width:0;cursor:pointer;direction:ltr}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink)}
.vol input{max-width:140px}
#toast{position:fixed;inset-inline:0;bottom:100px;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--main);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
@media(max-width:760px){
.app{grid-template-columns:1fr;grid-template-rows:auto 1fr 150px;height:100%}
aside{grid-row:1;padding:10px 12px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.logo{margin:0 6px 0 0}.logo span{display:none}
nav{display:flex;gap:4px}nav h3{display:none}nav button{width:auto;white-space:nowrap;margin:0;padding:6px 10px}
main{grid-row:2;padding:16px}
footer{grid-row:3;grid-template-columns:1fr;gap:4px;padding:8px 16px}.vol{display:none}
.np .cover{display:none}.strip{display:none}
.row{grid-template-columns:1fr 50px 30px}.row .ar{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img src="icons/icon.png" alt="" width="36" height="36"><span>دەنگ</span></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="گەڕان…" aria-label="گەڕان"></label>
      <span class="sp"></span>
      <button class="add" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>زیادکردنی گۆرانی</button>
      <button class="ib" id="theme" aria-label="گۆڕینی ڕووکار"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
    <input id="file" type="file" multiple hidden accept="audio/*,video/*,.mp3,.flac,.wav,.ogg,.oga,.opus,.m4a,.aac,.wma,.ape,.wv,.alac,.aiff,.aif,.amr,.mka,.mp2,.ac3,.dts,.webm,.caf,.tta,.mid">
    <div id="view"></div>
  </main>
  <footer>
    <div class="np"><div class="cover" id="npc">♪</div><div style="min-width:0"><b id="npt">هیچ گۆرانییەک نییە</b><small id="npa"></small></div><button class="ib" id="like" aria-label="دڵخواز"></button><button class="ib" id="del" aria-label="سڕینەوە"></button></div>
    <div class="ctl">
      <div class="btns">
        <button id="shuf" aria-label="تێکەڵ"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button id="prev" aria-label="پێشوو"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8zM5 19V5"/></svg></button>
        <button id="play" class="big" aria-label="لێدان"></button>
        <button id="next" aria-label="دواتر"><svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8zM19 5v14"/></svg></button>
        <button id="rep" aria-label="دووبارە"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="شوێنی گۆرانی"><span id="dur">0:00</span></div>
    </div>
    <div class="vol"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><input type="range" id="vol" min="0" max="100" value="80" aria-label="دەنگ"></div>
  </footer>
</div>
<div id="toast" role="status"></div>
<audio id="au" preload="metadata"></audio>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const IC={home:'M3 11 12 3l9 8M5 10v10h14V10',browse:'M3 6h18M3 12h18M3 18h18',art:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',pl:'M3 6h12M3 12h12M3 18h7M19 8v9M16 17a3 3 0 1 0 6 0',heart:'M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z',clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',play:'M7 4v16l13-8z',pause:'M7 4h3v16H7zM14 4h3v16h-3z',trash:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5',pcirc:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM10 8l6 4-6 4z'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const NAV=[['home','سەرەکی','home'],['browse','گەڕان','browse'],['_','کتێبخانەکەت'],['artists','هونەرمەندان','art'],['lists','لیستەکان','pl'],['liked','دڵخوازەکان','heart'],['recent','نوێترین','clock']];
let T=[],cur=-1,queue=[],view={n:'home'},shuf=false,rep=0,batch=0,ff=null,ffBusy=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const bg=s=>`background:linear-gradient(135deg,hsl(${hue(s)} 55% 55%),hsl(${(hue(s)+60)%360} 60% 40%))`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}

/* navigation with soft transitions */
function go(v){view=v;const el=$('#view');el.classList.add('out');setTimeout(()=>{render();el.classList.remove('out');$('main').scrollTo({top:0})},200)}
function drawNav(){$('#nav').innerHTML=NAV.map(([k,l,i])=>k==='_'?`<h3>${l}</h3>`:`<button data-k="${k}" ${view.n===k||view.root===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go({n:b.dataset.k}))}
function rowHtml(t){return `<button class="row ${t.id===(T[cur]||{}).id?'on':''}" data-id="${t.id}"><b>${esc(t.title)}</b><span class="ar">${esc(t.artist)}</span><span>${fmt(t.dur)}</span><span class="pl">${ic('pcirc')}</span></button>`}
function listHtml(a){return a.length?a.map(rowHtml).join(''):''}
function emptyHtml(){return `<div class="empty"><b>هێشتا گۆرانییەک نییە</b>فایلی دەنگی زیاد بکە، یان لێرە دایبنێ.<br>MP3، FLAC، WAV، OGG، OPUS، M4A، WMA، APE و فۆرماتی تر.</div>`}
function groupsHtml(map,kind){return `<div class="groups">${[...map].map(([k,a])=>`<button class="g" data-g="${esc(k)}" data-kind="${kind}"><div class="cover" style="${bg(k)}">♪</div><b>${esc(k)}</b><small>${a.length} گۆرانی</small></button>`).join('')}</div>`}
function groupBy(f){const m=new Map();T.forEach(t=>{const k=f(t);(m.get(k)||m.set(k,[]).get(k)).push(t)});return m}
function render(){
 drawNav();const q=$('#q').value.trim().toLowerCase();let h='';let rows=T;
 if(q)rows=T.filter(t=>(t.title+t.artist).toLowerCase().includes(q));
 const n=view.n;
 if(n==='home'&&!q){
  const t=T[cur]||T[0];
  h=T.length?`<div class="hero"><div class="cover" style="${bg(t.title)}">♪</div><div><h1>${esc(t.title)}</h1><p>${esc(t.artist)}</p></div><div class="strip">${T.slice(0,4).map(x=>`<button class="cover" data-id="${x.id}" style="${bg(x.title)}" aria-label="${esc(x.title)}">♪</button>`).join('')}</div></div><h2>تایبەت بۆ تۆ</h2>${listHtml(T)}`:emptyHtml();
 }else if(n==='artists'&&!q)h=T.length?groupsHtml(groupBy(t=>t.artist),'a'):emptyHtml();
 else if(n==='lists'&&!q)h=T.length?groupsHtml(groupBy(t=>t.list),'l'):emptyHtml();
 else{
  let title='هەموو گۆرانییەکان';
  if(n==='liked'){rows=rows.filter(t=>t.liked);title='دڵخوازەکان'}
  if(n==='recent'){rows=rows.filter(t=>t.played).sort((a,b)=>b.played-a.played);title='نوێترین'}
  if(n==='group'){rows=rows.filter(t=>(view.kind==='a'?t.artist:t.list)===view.k);title=view.k}
  if(q)title='ئەنجامی گەڕان';
  h=`<h2>${esc(title)}</h2>`+(rows.length?listHtml(rows):T.length?'<div class="empty">هیچ شتێک نەدۆزرایەوە.</div>':emptyHtml());
  queue=rows.map(t=>t.id);
 }
 if(n==='home'||n==='artists'||n==='lists')queue=T.map(t=>t.id);
 $('#view').innerHTML=h;
 document.querySelectorAll('#view .row,#view button[data-id]').forEach(b=>b.onclick=()=>playId(+b.dataset.id));
 document.querySelectorAll('#view .g').forEach(b=>b.onclick=()=>go({n:'group',k:b.dataset.g,kind:b.dataset.kind,root:b.dataset.kind==='a'?'artists':'lists'}));
}

/* importing */
function parse(name){const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ');const m=base.split(/\s+-\s+/);return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'نەناسراو',title:base.trim()}}
async function addFiles(files){
 const list=[...files];if(!list.length)return;batch++;let ok=0;
 for(const f of list){
  if(f.type&&!/^(audio|video)\//.test(f.type)&&f.type!=='application/ogg')continue;
  const p=parse(f.name),t={id:Date.now()+Math.random(),file:f,url:URL.createObjectURL(f),liked:false,played:0,dur:0,list:'کۆمەڵەی '+batch,...p};
  t.id=T.length?T[T.length-1].id+1:1;T.push(t);ok++;save(t);
  const probe=new Audio();probe.preload='metadata';probe.src=t.url;
  probe.onloadedmetadata=()=>{t.dur=probe.duration;save(t);if(view.n!=='artists'&&view.n!=='lists')softRefresh()};
 }
 if(ok){toast(ok+' گۆرانی زیادکرا');if(cur<0){cur=0;showNow()}go({n:view.n==='group'?'home':view.n,k:view.k,kind:view.kind})}else toast('فایلێکی دەنگی نەدۆزرایەوە')
}
function softRefresh(){const y=$('main').scrollTop;render();$('main').scrollTop=y}
$('#addBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});

/* IndexedDB: tracks persist between sessions */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('deng',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{try{const d=await DB;return await new Promise((ok,no)=>{const s=d.transaction('tracks',m).objectStore('tracks'),r=f(s);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch(e){return null}};
const save=t=>tx('readwrite',s=>s.put({id:t.id,file:t.file,title:t.title,artist:t.artist,dur:t.dur,liked:t.liked,played:t.played,list:t.list}));
async function restore(){const a=await tx('readonly',s=>s.getAll());if(!a||!a.length)return;
 a.sort((x,y)=>x.id-y.id).forEach(r=>{T.push({...r,url:URL.createObjectURL(r.file)});batch=Math.max(batch,parseInt((r.list.match(/\d+/)||[0])[0])||0)});
 cur=-1;render();toast(T.length+' گۆرانی گەڕایەوە');if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
function likeUI(){const t=T[cur],b=$('#like');b.innerHTML=ic('heart');b.firstChild.style.fill=t&&t.liked?'currentColor':'none';$('#del').innerHTML=ic('trash')}
$('#like').onclick=()=>{const t=T[cur];if(!t)return;t.liked=!t.liked;save(t);likeUI();toast(t.liked?'زیادکرا بۆ دڵخوازەکان':'لە دڵخوازەکان لابرا');if(view.n==='liked')softRefresh()};
$('#del').onclick=()=>{const t=T[cur];if(!t||!confirm('«'+t.title+'» بسڕدرێتەوە؟'))return;
 au.pause();au.removeAttribute('src');au.load();URL.revokeObjectURL(t.url);if(t.conv)URL.revokeObjectURL(t.conv);tx('readwrite',s=>s.delete(t.id));
 T.splice(cur,1);cur=-1;$('#npt').textContent='هیچ گۆرانییەک نییە';$('#npa').textContent='';$('#npc').removeAttribute('style');$('#npc').textContent='♪';$('#cur').textContent='0:00';$('#dur').textContent='0:00';$('#seek').value=0;setP($('#seek'),0);likeUI();softRefresh()};

/* playback */
const idx=id=>T.findIndex(t=>t.id===id);
function playId(id){const i=idx(id);if(i<0)return;load(i,true)}
function load(i,go_){
 cur=i;const t=T[i];t.played=Date.now();save(t);showNow();au.src=t.conv||t.url;
 if(go_)au.play().catch(()=>{});softRefresh();
}
function showNow(){const t=T[cur];if(!t)return;likeUI();$('#npt').textContent=t.title;$('#npa').textContent=t.artist;$('#npc').setAttribute('style',bg(t.title));
 if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
 navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause());
 navigator.mediaSession.setActionHandler('previoustrack',prev);navigator.mediaSession.setActionHandler('nexttrack',next)}}
function step(d){if(!T.length)return;const q=queue.length?queue:T.map(t=>t.id);let i=q.indexOf(T[cur]&&T[cur].id);
 if(shuf)i=Math.floor(Math.random()*q.length);else i=(i+d+q.length)%q.length;playId(q[i])}
function next(){step(1)}
function prev(){if(au.currentTime>3)au.currentTime=0;else step(-1)}
$('#next').onclick=next;$('#prev').onclick=prev;
$('#play').onclick=()=>{if(cur<0)return $('#addBtn').click();au.paused?au.play():au.pause()};
$('#shuf').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf)};
$('#rep').onclick=e=>{rep=(rep+1)%3;e.currentTarget.classList.toggle('on',rep>0);au.loop=rep===2;toast(['دووبارەکردنەوە کوژاوەیە','هەموو لیستەکە دووبارە دەبێتەوە','ئەم گۆرانییە دووبارە دەبێتەوە'][rep])};
au.onplay=()=>$('#play').innerHTML=ic('pause');au.onpause=()=>$('#play').innerHTML=ic('play');$('#play').innerHTML=ic('play');
au.onended=()=>{if(rep===0&&queue.indexOf(T[cur].id)===queue.length-1)return;next()};
const setP=(el,v)=>el.style.setProperty('--p',v+'%');
au.ontimeupdate=()=>{if(!au.duration)return;const v=au.currentTime/au.duration*1000;$('#seek').value=v;setP($('#seek'),v/10);$('#cur').textContent=fmt(au.currentTime)};
au.onloadedmetadata=()=>{$('#dur').textContent=fmt(au.duration);if(T[cur]&&!T[cur].dur)T[cur].dur=au.duration};
$('#seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration;setP(e.target,e.target.value/10)};
$('#vol').oninput=e=>{au.volume=e.target.value/100;setP(e.target,e.target.value)};au.volume=.8;setP($('#vol'),80);
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('#play').click()}if(e.key==='ArrowRight')au.currentTime+=5;if(e.key==='ArrowLeft')au.currentTime-=5});

/* ffmpeg fallback: used only when the browser can't decode the file */
const addScript=s=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function loadFF(){if(window.FFmpegWASM)return;try{await addScript('vendor/ffmpeg/ffmpeg.js')}catch(e){await addScript('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js')}}
au.onerror=async()=>{
 const t=T[cur];if(!t||t.conv||ffBusy||!au.src)return;ffBusy=true;toast('براوزەر ئەم فۆرماتە ناخوێنێتەوە — گۆڕین بە ffmpeg…');
 try{
  if(!ff){await loadFF();
   const {FFmpeg}=FFmpegWASM;ff=new FFmpeg();
   const A=p=>new URL(p,location.href).href;
   try{await ff.load({coreURL:A('vendor/core/ffmpeg-core.js'),wasmURL:A('vendor/core/ffmpeg-core.wasm')})}
   catch(e){ff=new FFmpeg();await ff.load({coreURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',wasmURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'})}}
  const buf=new Uint8Array(await t.file.arrayBuffer());
  await ff.writeFile('in',buf);await ff.exec(['-i','in','-vn','-ac','2','-ar','44100','out.wav']);
  const out=await ff.readFile('out.wav');t.conv=URL.createObjectURL(new Blob([out.buffer],{type:'audio/wav'}));
  await ff.deleteFile('in');await ff.deleteFile('out.wav');
  if(T[cur]===t){au.src=t.conv;au.play().catch(()=>{})}
 }catch(e){ff=null;toast('ffmpeg لەم شوێنەدا کار ناکات — ئەپەکە لەسەر هۆستی خۆت دابنێ')}
 ffBusy=false};

/* misc */
$('#q').oninput=()=>{if(view.n==='home'||view.n==='artists'||view.n==='lists')view.n='browse';render()};
$('#theme').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const now=r.dataset.theme||(d?'dark':'light');r.dataset.theme=now==='dark'?'light':'dark'};
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
likeUI();render();restore();
</script>
</body>
</html>

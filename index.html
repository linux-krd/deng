<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جریوە</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="icons/icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--side:#d4d4d4;--main:#fff;--bar:#d4d4d4;--ink:#111;--mute:#6b6b6b;--line:#e4e4e4;--chip:#d9d9d9;--hover:#f2f2f2;--focus:#111;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0d;--side:#1c1c1c;--main:#141414;--bar:#1c1c1c;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2a2a2a;--chip:#2a2a2a;--hover:#1f1f1f;--focus:#fff}}
:root[data-theme=dark]{--bg:#0d0d0d;--side:#1c1c1c;--main:#141414;--bar:#1c1c1c;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2a2a2a;--chip:#2a2a2a;--hover:#1f1f1f;--focus:#fff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;height:100%;background:var(--main);display:grid;grid-template-columns:230px 1fr;grid-template-rows:1fr 84px;overflow:hidden}
aside{grid-row:1;background:var(--side);padding:22px 18px;overflow:auto}
.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;margin-bottom:26px}

nav button{width:100%;justify-content:flex-start;gap:10px;padding:7px 12px;border:2px solid transparent;border-radius:8px;font-size:14px;margin-bottom:6px;color:var(--mute);transition:background .2s,border-color .2s,color .2s}
nav button:hover{background:var(--hover)}
nav button[aria-current=page]{background:var(--chip);color:var(--ink);font-weight:500}
nav h3{font-size:13px;font-weight:500;margin:22px 12px 10px}
main{grid-row:1;overflow:auto;padding:22px 30px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.search{flex:1;max-width:340px;background:var(--chip);border-radius:20px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;font:inherit;font-size:13px;padding:9px 0;color:var(--ink);outline:0}
.search:focus-within{outline:2px solid var(--focus)}
.top .sp{flex:1}
.ib{width:34px;height:34px;border-radius:50%;font-size:17px}
.ib:hover{background:var(--hover)}
.add{background:var(--ink);color:var(--main);border-radius:18px;padding:8px 16px;font-size:13px;gap:6px}
#view{transition:opacity .22s,transform .22s}
#view.out{opacity:0;transform:translateY(8px)}
.hero{display:flex;gap:22px;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap}
.cover{width:150px;height:150px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;background-size:cover;background-position:center}
.hero h1{font-size:24px;margin:0 0 4px}
.hero p{margin:0;font-weight:700;font-size:14px;color:var(--mute)}
.strip{display:flex;gap:10px;margin-inline-start:auto}
.strip .cover{width:62px;height:62px;font-size:22px;border-radius:3px;opacity:.9}
.strip .cover:hover{opacity:1}
h2{font-size:17px;margin:0 0 10px}
.row{display:grid;grid-template-columns:var(--c);align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:14px;width:100%;text-align:start;transition:background .15s}
.row:hover{background:var(--hover)}
.row b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on b{text-decoration:underline;text-underline-offset:4px}
.row .pl{font-size:20px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.g{text-align:start;display:block;border-radius:8px;transition:transform .2s}
.g:hover{transform:translateY(-3px)}
.g .cover{width:100%;height:auto;aspect-ratio:1;font-size:40px;border-radius:6px}
.g b{display:block;margin-top:8px;font-size:14px}.g small{color:var(--mute)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--mute);line-height:2}
.empty b{color:var(--ink);display:block;font-size:16px}
footer{grid-column:1/-1;background:var(--bar);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:16px;padding:0 24px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .cover{width:52px;height:52px;font-size:20px;border-radius:3px}
.np .ib{flex:none}.np .ib:first-of-type{margin-inline-start:auto}.np b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np small{color:var(--mute)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;gap:14px;align-items:center;font-size:18px}
.btns .big{font-size:26px}
.btns .on{color:var(--ink);background:var(--chip);border-radius:50%}
.btns button{width:30px;height:30px;border-radius:50%}
.bar{display:flex;align-items:center;gap:8px;width:100%;font-size:11px;color:var(--mute);direction:ltr}
.vol{display:flex;align-items:center;gap:10px;justify-content:flex-end;font-size:17px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),#8886 var(--p,0%));flex:1;min-width:0;cursor:pointer;direction:ltr}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ink)}
.vol input{max-width:140px}
#toast{position:fixed;inset-inline:0;bottom:100px;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--main);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
@media(max-width:760px){
.app{grid-template-columns:1fr;grid-template-rows:auto 1fr 150px;height:100%}
aside{grid-row:1;padding:10px 12px;display:flex;align-items:center;gap:6px;overflow-x:auto}
.logo{margin:0 6px 0 0}.logo span{display:none}
nav{display:flex;gap:4px}nav h3{display:none}nav button{width:auto;white-space:nowrap;margin:0;padding:6px 10px}
main{grid-row:2;padding:16px}
footer{grid-row:3;grid-template-columns:1fr;gap:4px;padding:8px 16px}.vol{display:none}
.cw{display:none}.strip{display:none}
.items.list .ar,.items.compact .ar{display:none}.items.list{--c:44px 1fr 50px 30px}.items.compact{--c:1fr 50px 30px}.items.selm.list{--c:26px 44px 1fr 50px 30px}.items.selm.compact{--c:26px 1fr 50px 30px}
}

.items.list{--c:44px 1fr 140px 60px 34px}.items.compact{--c:1fr 140px 60px 34px}.items.selm.list{--c:26px 44px 1fr 140px 60px 34px}.items.selm.compact{--c:26px 1fr 140px 60px 34px}
.th{width:44px;height:44px;border-radius:5px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:18px}
.row .th{color:#fff}.compact .th{display:none}
.ck{display:none;width:20px;height:20px;border:2px solid var(--mute);border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-style:normal}
.selm .ck{display:flex}.sd{background:var(--chip)}.sd .ck{background:var(--ink);color:var(--main);border-color:var(--ink)}
.items.grid,.items.large{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.items.large{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid .row,.large .row{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:8px;position:relative;text-align:start}
.grid .th,.large .th{width:100%;height:auto;aspect-ratio:1;border-radius:8px;font-size:34px}
.grid .du,.large .du,.grid .pl,.large .pl{display:none}
.grid .ck,.large .ck{position:absolute;top:14px;inset-inline-start:14px;background:var(--main);z-index:1}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.hd h2{margin:0}
.tl{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px}
.tb{gap:5px;padding:6px 11px;border-radius:14px;background:var(--chip);font-size:12px}.tb:disabled{opacity:.4;cursor:default}.dg{color:#e5574a}
.ib.act{background:var(--chip)}
.set h3{font-size:14px;margin:22px 0 8px}.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 16px;border-radius:18px;background:var(--chip);font-size:13px}.seg button[aria-pressed=true]{background:var(--ink);color:var(--main)}
dialog{border:0;border-radius:14px;background:var(--main);color:var(--ink);padding:22px;max-width:340px;font-family:inherit}dialog::backdrop{background:#0006}
dialog p{margin:0 0 18px;line-height:1.8}dialog form{display:flex;gap:8px;flex-wrap:wrap}dialog button{padding:8px 18px;border-radius:16px;background:var(--chip)}dialog button[value=y]{background:var(--ink);color:var(--main)}
.about{max-width:460px;margin:10px auto;text-align:center}.about img{display:block;margin:0 auto 8px}.about h1{margin:0 0 6px;font-size:26px}.about p{color:var(--mute);margin:0 0 20px;line-height:1.9}.ab{display:flex;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:14px;text-align:start}.ab span{color:var(--mute)}.ab a{color:var(--ink);text-underline-offset:3px}
main,aside{scrollbar-width:none}main::-webkit-scrollbar,aside::-webkit-scrollbar{display:none}
.logo img,.about img{object-fit:contain;background:linear-gradient(135deg,#ffffffb0,#ffffff30);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff90;box-shadow:0 4px 14px #0002,inset 0 1px 0 #fff9}
.logo img{width:42px;height:42px;padding:5px;border-radius:13px}.about img{width:120px;height:120px;padding:12px;border-radius:30px}
.cw{position:relative;flex:none}.np .cover{width:60px;height:60px}
.cw.pl .cover{animation:pulse 2.4s ease-in-out infinite}
.eq{position:absolute;inset-inline-end:4px;bottom:4px;display:none;gap:2px;align-items:flex-end;height:18px;padding:3px;border-radius:5px;background:#0007;font-style:normal}
.cw.pl .eq{display:flex}.eq s{display:block;width:3px;height:20%;background:#fff;border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq s:nth-child(2){animation-delay:.25s}.eq s:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #4a6fd055}50%{transform:scale(1.06);box-shadow:0 0 0 8px #4a6fd000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.cw.pl .cover,.eq s{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img src="icons/icon.png" alt="" width="36" height="36"><span>جریوە</span></div>

  </aside>
  <main>
    <div class="top">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="گەڕان…" aria-label="گەڕان"></label>
      <span class="sp"></span>

        <button id="prev" aria-label="پێشوو"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8zM5 19V5"/></svg></button>

</div>
<dialog id="dlg"><form method="dialog"><p id="dm"></p><button value="n" id="dn"></button><button value="y" id="dy">OK</button></form></dialog>

let T=[],cur=-1,queue=[],view={n:'home'},shuf=false,rep=0,batch=0,ff=null,ffBusy=false;

/* navigation with soft transitions */
function go(v){view=v;selMode=false;sel.clear();const el=$('#view');el.classList.add('out');setTimeout(()=>{render();el.classList.remove('out');$('main').scrollTo({top:0})},200)}
function drawNav(){$('#nav').innerHTML=NAV.map(([k,l,i])=>k==='_'?`<h3>${L(l)}</h3>`:`<button data-k="${k}" ${view.n===k||view.root===k?'aria-current="page"':''}>${ic(i)}${L(l)}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go({n:b.dataset.k}))}
let sel=new Set(),selMode=false,vm=LS.get('deng-vm')||'list';
const VM=['list','compact','grid','large'];if(!VM.includes(vm))vm='list';
const nm=a=>!a||a==='نەناسراو'?L('unknown'):a;
const ln=l=>/\d+/.test(l)?L('batch')+' '+l.match(/\d+/)[0]:l;
const art=t=>t.cu?`background-image:url(${t.cu})`:bg(t.title);
function ask(m){return new Promise(ok=>{const d=$('#dlg');$('#dm').textContent=m;d.showModal();d.onclose=()=>ok(d.returnValue==='y')})}
function rowHtml(t){return `<button class="row ${t.id===(T[cur]||{}).id?'on':''} ${sel.has(t.id)?'sd':''}" data-id="${t.id}"><i class="ck">${sel.has(t.id)?ic('check'):''}</i><span class="th" style="${art(t)}">${t.cu?'':'♪'}</span><b>${esc(t.title)}</b><span class="ar">${esc(nm(t.artist))}</span><span class="du">${fmt(t.dur)}</span><span class="pl">${ic('pcirc')}</span></button>`}
function listHtml(a){return `<div class="items ${vm} ${selMode?'selm':''}">${a.map(rowHtml).join('')}</div>`}
function emptyHtml(){return `<div class="empty"><b>${L('emptyT')}</b>${L('emptyD')}<br>MP3، FLAC، WAV، OGG، OPUS، M4A، WMA، APE…</div>`}
function groupsHtml(map,kind){return `<div class="groups">${[...map].map(([k,a])=>{const c=a.find(x=>x.cu);return `<button class="g" data-g="${esc(k)}" data-kind="${kind}"><div class="cover" style="${c?art(c):bg(k)}">${c?'':'♪'}</div><b>${esc(k)}</b><small>${a.length} ${L('songs')}</small></button>`}).join('')}</div>`}
function groupBy(f){const m=new Map();T.forEach(t=>{const k=f(t);(m.get(k)||m.set(k,[]).get(k)).push(t)});return m}
function tools(){
 if(selMode)return `<div class="tl"><span>${sel.size} ${L('selected')}</span><button class="tb" data-a="all">${L('selAll')}</button><button class="tb dg" data-a="del" ${sel.size?'':'disabled'}>${ic('trash')}${L('delSel')}</button><button class="tb" data-a="dup">${ic('dup')}${L('dups')}</button><button class="tb" data-a="cancel">${L('cancel')}</button></div>`;
 return `<div class="tl">${VM.map(v=>`<button class="ib ${vm===v?'act':''}" data-vm="${v}" aria-label="${L('v_'+v)}" title="${L('v_'+v)}">${ic('v_'+v)}</button>`).join('')}<button class="tb" data-a="sel">${ic('check')}${L('select')}</button><button class="tb" data-a="dup">${ic('dup')}${L('dups')}</button></div>`}

function settingsHtml(){
 const seg=(arr,c,k)=>`<div class="seg">${arr.map(([v,l])=>`<button aria-pressed="${c===v}" data-s="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
 return `<h2>${L('settings')}</h2><div class="set"><h3>${L('language')}</h3>${seg([['ckb','کوردی سۆرانی'],['fa','فارسی'],['en','English']],lang,'lang')}<h3>${L('theme')}</h3>${seg([['auto',L('tAuto')],['light',L('tLight')],['dark',L('tDark')]],LS.get('deng-theme')||'auto','theme')}<h3>${L('defView')}</h3>${seg(VM.map(v=>[v,L('v_'+v)]),vm,'vm')}</div>`}
const aboutHtml=()=>`<div class="about"><img src="icons/icon.png" alt="" width="120" height="120"><h1>جریوە</h1><p>${L('aboutDesc')}</p>
<div class="ab"><span>${L('version')}</span><b dir="ltr">1.0</b></div>
<div class="ab"><span>${L('license')}</span><b>${L('licenseV')}</b></div>
<div class="ab"><span>${L('designedBy')}</span><b>${L('kl')}</b></div>
<div class="ab"><span>${L('website')}</span><a dir="ltr" href="https://linux.krd" target="_blank" rel="noopener">linux.krd</a></div>
<div class="ab"><span>${L('github')}</span><a dir="ltr" href="https://github.com/linux-krd" target="_blank" rel="noopener">github.com/linux-krd</a></div></div>`;
function render(){
 drawNav();const q=$('#q').value.trim().toLowerCase();let h='',rows=T;
 if(q)rows=T.filter(t=>(t.title+t.artist).toLowerCase().includes(q));
 const n=view.n;
 if(n==='settings'&&!q)h=settingsHtml();
 else if(n==='about'&&!q)h=aboutHtml();
 else if(n==='home'&&!q){
  h=T.length?`${hd(L('mine'))}${listHtml(T)}`:emptyHtml();
 }else if(n==='artists'&&!q)h=T.length?groupsHtml(groupBy(t=>nm(t.artist)),'a'):emptyHtml();
 else if(n==='lists'&&!q)h=T.length?groupsHtml(groupBy(t=>ln(t.list)),'l'):emptyHtml();
 else{
  let title=L('all');
  if(n==='liked'){rows=rows.filter(t=>t.liked);title=L('liked')}
  if(n==='recent'){rows=rows.filter(t=>t.played).sort((a,b)=>b.played-a.played);title=L('recent')}
  if(n==='group'){rows=rows.filter(t=>(view.kind==='a'?nm(t.artist):ln(t.list))===view.k);title=view.k}
  if(q)title=L('results');
  h=(rows.length?hd(title)+listHtml(rows):`<h2>${esc(title)}</h2>`+(T.length?`<div class="empty">${L('none')}</div>`:emptyHtml()));
  queue=rows.map(t=>t.id);
 }
 if(n==='home'||n==='artists'||n==='lists')queue=T.map(t=>t.id);
 $('#view').innerHTML=h;
 document.querySelectorAll('#view .row,#view button[data-id]').forEach(b=>b.onclick=()=>selMode&&b.classList.contains('row')?tog(+b.dataset.id):playId(+b.dataset.id));
 document.querySelectorAll('#view .g').forEach(b=>b.onclick=()=>go({n:'group',k:b.dataset.g,kind:b.dataset.kind,root:b.dataset.kind==='a'?'artists':'lists'}));
 document.querySelectorAll('#view [data-vm]').forEach(b=>b.onclick=()=>{vm=b.dataset.vm;LS.set('deng-vm',vm);softRefresh()});
 document.querySelectorAll('#view [data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
 document.querySelectorAll('#view [data-s]').forEach(b=>b.onclick=()=>{const v=b.dataset.v,k=b.dataset.s;
  if(k==='lang'){lang=v;LS.set('deng-lang',v);if(view.n==='group')view={n:view.root};applyLang()}
  if(k==='theme')applyTheme(v);if(k==='vm'){vm=v;LS.set('deng-vm',v)}softRefresh()});
}
function tog(id){sel.has(id)?sel.delete(id):sel.add(id);softRefresh()}
function findDups(){const a=new Set(),b=new Set(),d=[];T.forEach(t=>{const k1=t.file.size,k2=(t.title+'|'+(t.artist||'')).toLowerCase().replace(/\s+/g,' ').trim();if(a.has(k1)||b.has(k2))d.push(t.id);else{a.add(k1);b.add(k2)}});return d}
function resetNow(){$('#npt').textContent=L('nosong');$('#npa').textContent='';$('#npc').removeAttribute('style');$('#npc').textContent='♪';$('#cur').textContent='0:00';$('#dur').textContent='0:00';$('#seek').value=0;setP($('#seek'),0);likeUI()}
function removeTracks(ids){
 const S=new Set(ids),ct=T[cur]&&T[cur].id;
 ids.forEach(id=>tx('readwrite',s=>s.delete(id)));
 T.filter(t=>S.has(t.id)).forEach(t=>{[t.url,t.conv,t.cu].forEach(u=>u&&URL.revokeObjectURL(u))});
 T=T.filter(t=>!S.has(t.id));sel.clear();
 if(S.has(ct)){au.pause();au.removeAttribute('src');au.load();cur=-1;resetNow()}else cur=T.findIndex(t=>t.id===ct);
}
async function act(a){
 if(a==='sel'){selMode=true}
 else if(a==='cancel'){selMode=false;sel.clear()}
 else if(a==='all'){sel=new Set(queue)}
 else if(a==='dup'){const d=findDups();if(!d.length)return toast(L('noDup'));
  if(selMode){sel=new Set(d);toast(d.length+' '+L('dupSel'))}
  else if(await ask(d.length+' '+L('dupFound'))){removeTracks(d);toast(d.length+' '+L('removed'))}}
 else if(a==='del'){if(!sel.size||!await ask(sel.size+' — '+L('confirmDel')))return;const n=sel.size;removeTracks([...sel]);selMode=false;toast(n+' '+L('removed'))}
 softRefresh()}
function applyTheme(v){const r=document.documentElement;v==='auto'?delete r.dataset.theme:r.dataset.theme=v;LS.set('deng-theme',v)}
function applyLang(){const r=document.documentElement;r.lang=lang;r.dir=lang==='en'?'ltr':'rtl';
 $('#q').placeholder=L('search');$('#q').setAttribute('aria-label',L('search'));$('#addT').textContent=L('add');
 $('#theme').setAttribute('aria-label',L('theme'));$('#like').setAttribute('aria-label',L('liked'));$('#del').setAttribute('aria-label',L('delSel'));
 $('#dn').textContent=L('cancel');if(cur<0)$('#npt').textContent=L('nosong');if(cur>=0)showNow()}

/* embedded cover art: ID3v2 (MP3), FLAC picture, MP4/M4A covr */
const u32=(b,i)=>((b[i]<<24)|(b[i+1]<<16)|(b[i+2]<<8)|b[i+3])>>>0,ss=(b,i)=>(b[i]<<21)|(b[i+1]<<14)|(b[i+2]<<7)|b[i+3];
const mk=u=>u&&u.length>100?new Blob([u],{type:u[0]===0x89?'image/png':u[0]===0x47?'image/gif':u[0]===0x52?'image/webp':'image/jpeg'}):null;
async function getCover(f){try{
 const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
 if(h[0]===73&&h[1]===68&&h[2]===51&&h[3]>=3){const v=h[3],b=new Uint8Array(await f.slice(0,Math.min(f.size,ss(h,6)+10)).arrayBuffer());let p=10;
  while(p+10<b.length&&b[p]){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]),sz=v===4?ss(b,p+4):u32(b,p+4),d=p+10;
   if(id==='APIC'){const e=b[d];let i=d+1;while(b[i])i++;i+=2;
    if(e===1||e===2){while(!(b[i]===0&&b[i+1]===0)&&i<d+sz)i+=2;i+=2}else{while(b[i])i++;i++}
    return mk(b.slice(i,d+sz))}
   p=d+sz}return null}
 if(h[0]===0x66&&h[1]===0x4c&&h[2]===0x61){const b=new Uint8Array(await f.slice(0,Math.min(f.size,8e6)).arrayBuffer());let p=4;
  while(p+4<b.length){const last=b[p]>>7,ty=b[p]&127,len=(b[p+1]<<16)|(b[p+2]<<8)|b[p+3];
   if(ty===6){let i=p+8;i+=4+u32(b,i);i+=4+u32(b,i)+16;const n=u32(b,i);return mk(b.slice(i+4,i+4+n))}
   p+=4+len;if(last)break}return null}
 if(String.fromCharCode(h[4],h[5],h[6],h[7])==='ftyp'){const b=new Uint8Array(await f.slice(0,Math.min(f.size,3e6)).arrayBuffer());
  for(let i=0;i<b.length-24;i++)if(b[i]===99&&b[i+1]===111&&b[i+2]===118&&b[i+3]===114)return mk(b.slice(i+20,i+4+u32(b,i+4)))}
}catch(e){}return null}
/* importing */
function parse(name){const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ');const m=base.split(/\s+-\s+/);return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' - ').trim()}:{artist:'نەناسراو',title:base.trim()}}
async function addFiles(files){
 const list=[...files];if(!list.length)return;batch++;let ok=0;
 for(const f of list){
  if(f.type&&!/^(audio|video)\//.test(f.type)&&f.type!=='application/ogg')continue;
  const p=parse(f.name),t={id:Date.now()+Math.random(),file:f,url:URL.createObjectURL(f),liked:false,played:0,dur:0,list:'کۆمەڵەی '+batch,...p};
  t.id=T.length?T[T.length-1].id+1:1;T.push(t);ok++;save(t);getCover(f).then(c=>{if(c){t.cover=c;t.cu=URL.createObjectURL(c);save(t);softRefresh();if(T[cur]===t)showNow()}});
  const probe=new Audio();probe.preload='metadata';probe.src=t.url;
  probe.onloadedmetadata=()=>{t.dur=probe.duration;save(t);if(view.n!=='artists'&&view.n!=='lists')softRefresh()};
 }
 if(ok){toast(ok+' '+L('added'));if(cur<0){cur=0;showNow()}go({n:view.n==='group'?'home':view.n,k:view.k,kind:view.kind})}else toast(L('noaudio'))
}
function softRefresh(){const y=$('main').scrollTop;render();$('main').scrollTop=y}
$('#addBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});

/* IndexedDB: tracks persist between sessions */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('deng',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{try{const d=await DB;return await new Promise((ok,no)=>{const s=d.transaction('tracks',m).objectStore('tracks'),r=f(s);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch(e){return null}};
const save=t=>tx('readwrite',s=>s.put({id:t.id,file:t.file,title:t.title,artist:t.artist,dur:t.dur,liked:t.liked,played:t.played,list:t.list,cover:t.cover||null}));
async function restore(){const a=await tx('readonly',s=>s.getAll());if(!a||!a.length)return;
 a.sort((x,y)=>x.id-y.id).forEach(r=>{T.push({...r,url:URL.createObjectURL(r.file),cu:r.cover?URL.createObjectURL(r.cover):''});batch=Math.max(batch,parseInt((r.list.match(/\d+/)||[0])[0])||0)});
 cur=-1;render();toast(T.length+' '+L('restored'));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
function likeUI(){const t=T[cur],b=$('#like');b.innerHTML=ic('heart');b.firstChild.style.fill=t&&t.liked?'currentColor':'none';$('#del').innerHTML=ic('trash')}
$('#like').onclick=()=>{const t=T[cur];if(!t)return;t.liked=!t.liked;save(t);likeUI();toast(t.liked?L('likeOn'):L('likeOff'));if(view.n==='liked')softRefresh()};
$('#del').onclick=async()=>{const t=T[cur];if(!t||!await ask('«'+t.title+'» '+L('confirmDel')))return;removeTracks([t.id]);softRefresh()};

/* playback */
const idx=id=>T.findIndex(t=>t.id===id);
function playId(id){const i=idx(id);if(i<0)return;load(i,true)}
function load(i,go_){
 cur=i;const t=T[i];t.played=Date.now();save(t);showNow();au.src=t.conv||t.url;
 if(go_)au.play().catch(()=>{});softRefresh();
}
function showNow(){const t=T[cur];if(!t)return;likeUI();$('#npt').textContent=t.title;$('#npa').textContent=nm(t.artist);$('#npc').setAttribute('style',art(t));$('#npc').textContent=t.cu?'':'♪';
 if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:nm(t.artist),artwork:t.cu?[{src:t.cu}]:[]});
 navigator.mediaSession.setActionHandler('play',()=>au.play());navigator.mediaSession.setActionHandler('pause',()=>au.pause());
 navigator.mediaSession.setActionHandler('previoustrack',prev);navigator.mediaSession.setActionHandler('nexttrack',next)}}
function step(d){if(!T.length)return;const q=queue.length?queue:T.map(t=>t.id);let i=q.indexOf(T[cur]&&T[cur].id);
 if(shuf)i=Math.floor(Math.random()*q.length);else i=(i+d+q.length)%q.length;playId(q[i])}
function next(){step(1)}
function prev(){if(au.currentTime>3)au.currentTime=0;else step(-1)}
$('#next').onclick=next;$('#prev').onclick=prev;
$('#play').onclick=()=>{if(cur<0)return $('#addBtn').click();au.paused?au.play():au.pause()};
$('#shuf').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf)};
$('#rep').onclick=e=>{rep=(rep+1)%3;e.currentTarget.classList.toggle('on',rep>0);au.loop=rep===2;toast(L('rep'+rep))};
au.onplay=()=>{$('#play').innerHTML=ic('pause');$('#cw').classList.add('pl')};au.onpause=()=>{$('#play').innerHTML=ic('play');$('#cw').classList.remove('pl')};$('#play').innerHTML=ic('play');
au.onended=()=>{if(rep===0&&queue.indexOf(T[cur].id)===queue.length-1)return;next()};
const setP=(el,v)=>el.style.setProperty('--p',v+'%');
au.ontimeupdate=()=>{if(!au.duration)return;const v=au.currentTime/au.duration*1000;$('#seek').value=v;setP($('#seek'),v/10);$('#cur').textContent=fmt(au.currentTime)};
au.onloadedmetadata=()=>{$('#dur').textContent=fmt(au.duration);if(T[cur]&&!T[cur].dur)T[cur].dur=au.duration};
$('#seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration;setP(e.target,e.target.value/10)};
$('#vol').oninput=e=>{au.volume=e.target.value/100;setP(e.target,e.target.value)};au.volume=.8;setP($('#vol'),80);
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('#play').click()}if(e.key==='ArrowRight')au.currentTime+=5;if(e.key==='ArrowLeft')au.currentTime-=5});

/* ffmpeg fallback: used only when the browser can't decode the file */
const addScript=s=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function loadFF(){if(window.FFmpegWASM)return;try{await addScript('vendor/ffmpeg/ffmpeg.js')}catch(e){await addScript('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js')}}
au.onerror=async()=>{
 const t=T[cur];if(!t||t.conv||ffBusy||!au.src)return;ffBusy=true;toast(L('conv'));
 try{
  if(!ff){await loadFF();
   const {FFmpeg}=FFmpegWASM;ff=new FFmpeg();
   const A=p=>new URL(p,location.href).href;
   try{await ff.load({coreURL:A('vendor/core/ffmpeg-core.js'),wasmURL:A('vendor/core/ffmpeg-core.wasm')})}
   catch(e){ff=new FFmpeg();await ff.load({coreURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',wasmURL:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'})}}
  const buf=new Uint8Array(await t.file.arrayBuffer());
  await ff.writeFile('in',buf);await ff.exec(['-i','in','-vn','-ac','2','-ar','44100','out.wav']);
  const out=await ff.readFile('out.wav');t.conv=URL.createObjectURL(new Blob([out.buffer],{type:'audio/wav'}));
  await ff.deleteFile('in');await ff.deleteFile('out.wav');
  if(T[cur]===t){au.src=t.conv;au.play().catch(()=>{})}
 }catch(e){ff=null;toast(L('ffErr'))}
 ffBusy=false};

/* misc */
$('#q').oninput=()=>{if(['home','artists','lists','settings','about'].includes(view.n))view.n='browse';render()};
$('#theme').onclick=()=>{const d=matchMedia('(prefers-color-scheme:dark)').matches,now=document.documentElement.dataset.theme||(d?'dark':'light');applyTheme(now==='dark'?'light':'dark');if(view.n==='settings')softRefresh()};
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme(LS.get('deng-theme')||'auto');applyLang();likeUI();render();restore();
</script>
</body>
